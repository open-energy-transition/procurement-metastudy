# This file is used to define the scenarios that are run by snakemake. Each entry on the first level is a scenario. Each scenario can contain configuration overrides with respect to the config/config.yaml settings.
#
# Example
#
# custom-scenario: # name of the scenario
#   electricity:
#       renewable_carriers: [wind, solar] # override the list of renewable carriers

# ======== Baseline model without procurement ========
# ====================================================

baseline-3H:
  enable:
    procurement: false

baseline-2025-3H:
  scenario:
    planning_horizons: 2025
  
  enable:
    procurement: false

# ======== Baseline model with volume matching ========
# =====================================================

vol-match--3H:
  enable:
    procurement: true
  
  electricity:
   ci_load:
      profile: "baseload"

  procurement:
    strategy: vol-match
    scope: "all"
    energy_matching: 100
    participation: 20

vol-match-no_ember--3H:
  enable:
    procurement: true
  
  electricity:
   ci_load:
      profile: "baseload"
  
  res_target:
    EU_share_target: false
    country_cap_target: false

  procurement:
    strategy: vol-match
    scope: "all"
    energy_matching: 100
    participation: 20

vol-match-add--3H:
  enable:
    procurement: true
  
  electricity:
   ci_load:
      profile: "baseload"

  res_target:
    res_additionality: true

  procurement:
    strategy: vol-match
    scope: "all"
    energy_matching: 100
    participation: 20

vol-match-add-no_ember--3H:
  enable:
    procurement: true
  
  electricity:
   ci_load:
      profile: "baseload"

  res_target:
    EU_share_target: false
    country_cap_target: false
    res_additionality: true

  procurement:
    strategy: vol-match
    scope: "all"
    energy_matching: 100
    participation: 20

