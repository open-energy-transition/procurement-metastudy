# This file is used to define the scenarios that are run by snakemake. Each entry on the first level is a scenario. Each scenario can contain configuration overrides with respect to the config/config.yaml settings.
#
# Example
#
# custom-scenario: # name of the scenario
#   electricity:
#       renewable_carriers: [wind, solar] # override the list of renewable carriers

# ======== Baseline model without procurement ========
# ====================================================

baseline-3H:
  enable:
    procurement: false

baseline-1H:
  enable:
    procurement: false

  clustering:
    temporal:
      resolution_sector: 1H

# ======== Baseline model with volume matching ========
# =====================================================

vol-match--3H:
  enable:
    procurement: true
  
  electricity:
   ci_load:
      profile: "total"

  procurement:
    strategy: vol-match
    scope: "all"
    energy_matching: 100
    participation: 70

vol-match-add--3H:
  enable:
    procurement: true
  
  electricity:
   ci_load:
      profile: "total"

  res_target:
    res_additionality: true

  procurement:
    strategy: vol-match
    scope: "all"
    energy_matching: 100
    participation: 70

vol-match-short--3H:
  enable:
    procurement: true
  
  electricity:
   ci_load:
      profile: "total"

  procurement:
    strategy: vol-match
    scope: "country"
    energy_matching: 100
    participation: 70

    strip_snapshots: true
    #strip_network: true

vol-match-PL-DE-FR-ES-DK-IE-3H:
  enable:
    procurement: true
  
  electricity:
   ci_load:
      profile: "total"
  
  solving:
    mem_mb: 150000
    runtime: 24h

  procurement:
    strategy: vol-match
    scope: "all"
    energy_matching: 100
    participation: 70

    ci:
      Poland:
        location: "PL0 0"
      Germany:
        location: "DE0 0"
      France:
        location: "FR0 0"
      Spain:
        location: "ES0 0"
      Denmark:
        location: "DK0 0"
      Ireland:
        location: "IE3 0"

# ======== Baseline model with 247 CFE matching ========
# ======================================================

247-cfe--3H:
  enable:
    procurement: true

  electricity:
   ci_load:
      profile: "total"

  procurement:
    strategy: 247-cfe
    scope: node
    energy_matching: 100
    participation: 70

247-cfe-add--3H:
  enable:
    procurement: true

  electricity:
   ci_load:
      profile: "total"

  res_target:
    res_additionality: true

  procurement:
    strategy: 247-cfe
    scope: node
    energy_matching: 100
    participation: 70

247-cfe-short--3H:
  enable:
    procurement: true

  electricity:
   ci_load:
      profile: "total"

  procurement:
    strategy: 247-cfe
    scope: node
    energy_matching: 100
    participation: 70

    strip_snapshots: true
    #strip_network: true