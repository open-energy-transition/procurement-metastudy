# This file is used to define the scenarios that are run by snakemake. Each entry on the first level is a scenario. Each scenario can contain configuration overrides with respect to the config/config.yaml settings.
#
# Example
#
# custom-scenario: # name of the scenario
#   electricity:
#       renewable_carriers: [wind, solar] # override the list of renewable carriers

# ======== Baseline model without procurement ========
# ====================================================

baseline-3H:
  enable:
    procurement: false

baseline-1H:
  enable:
    procurement: false

  clustering:
    temporal:
      resolution_sector: 1H

# ======== Baseline model with volume matching ========
# =====================================================

vol-match-focus-3H:
  enable:
    procurement: true
  
  solving:
    mem_mb: 300000
    runtime: 72h

  clustering:
    temporal:
      resolution_sector: 3H
  
  electricity:
   ci_load:
      profile: "baseload"

  procurement:
    strategy: vol-match
    scope: "region"
    energy_matching: 100
    participation: 50

    ci:
      Poland:
        location: "PL0 0"
      Germany:
        location: "DE0 0"
      France:
        location: "FR0 0"
      Spain:
        location: "ES0 0"
      Italy:
        location: "IT0 0"
      United Kingdom:
        location: "GB2 0"